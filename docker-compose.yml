# Stack local de desenvolvimento.
#
# Sobe a stack completa: Postgres com pgvector, observabilidade (Prometheus,
# Tempo, Grafana) e a propria API.
#
# O perfil `api` deixa o servico opcional: `docker compose up -d` sobe so a
# infraestrutura (util para rodar a API do host, com reload); `--profile api`
# sobe tambem o container. Sem isso, quem esta desenvolvendo pagaria um rebuild
# de imagem a cada alteracao de codigo.
#
#   docker compose up -d
#   docker compose down -v     # -v tambem apaga os volumes de dados
#
#   API          http://localhost:8000   rodando no host
#                http://localhost:8080   rodando no compose (--profile api)
#   KYC          http://localhost:8101   servico de conformidade (--profile api)
#   Suporte      http://localhost:8201   atendimento ao cliente (--profile api)
#   Grafana      http://localhost:3000   (painel provisionado, sem login)
#   Prometheus   http://localhost:9090
#   Tempo        http://localhost:3200   (OTLP em 4318)
#
# Para o tracing chegar ao Tempo, a API precisa de:
#   CREDIT_OTLP_ENDPOINT=http://localhost:4318

name: esteira-credito

services:
  postgres:
    # Imagem oficial do pgvector sobre Postgres 17 — evita compilar a extensao.
    image: pgvector/pgvector:pg17
    container_name: credito-postgres
    environment:
      POSTGRES_USER: credito
      POSTGRES_PASSWORD: credito_local
      POSTGRES_DB: credito
      # Acelera testes: sem fsync a cada commit. Aceitavel porque perder este
      # banco custa um `docker compose down -v` seguido de reingestao.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    ports:
      - "5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
      # Scripts de initdb rodam automaticamente, em ordem alfabetica, apenas na
      # primeira subida (diretorio de dados vazio).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # Montado fora do initdb.d porque e aplicado duas vezes pelo script —
      # uma em `credito`, outra em `credito_test`.
      - ./infra/postgres/schema.sql:/schema.sql:ro
    healthcheck:
      # `pg_isready` responde antes de o initdb terminar; consultar a extensao
      # garante que o schema esta pronto de verdade antes de o teste conectar.
      # `-tAc` devolve o valor cru (sem cabecalho nem alinhamento), o que torna
      # o `grep` confiavel.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U credito -d credito &&
          psql -U credito -d credito -tAc
          "SELECT 1 FROM pg_extension WHERE extname='vector'" | grep -q 1
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------- Armazenamento (Camada 8)
  #
  # MinIO e ElasticMQ falam S3 e SQS, e sao livres e sem conta — o que preserva a restricao do
  # projeto. O LocalStack faria os dois com o protocolo da AWS de verdade e passou a exigir auth
  # token, que quebraria "roda sem conta em provedor nenhum".
  #
  # O que **nao** e exercitado por esta escolha: o runtime da Lambda, o empacotamento em container
  # image e o gatilho de evento do S3. O handler da extracao roda (e o mesmo do trabalhador); o
  # adapter da Lambda, nao. Fica na lista de "validado, nunca aplicado".
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: credito-minio
    command: server /data --console-address ":9001"
    environment:
      # Credencial de desenvolvimento, e o valor esta aqui de proposito: e um servico local sem
      # dado real. Chave de verdade nao entra em compose — o `.githooks/pre-commit` varre por
      # formato de chave, e este par nao casa com nenhum dos padroes reais.
      MINIO_ROOT_USER: credito
      MINIO_ROOT_PASSWORD: credito_local_minio
    ports:
      # 9000 API, 9001 console. Console publicado porque inspecionar objeto durante depuracao e o
      # que responde "o documento chegou?" mais rapido que qualquer log.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dados:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Cria o bucket **com versionamento** e sai.
  #
  # Um job e nao um passo na aplicacao: criar bucket exige `s3:CreateBucket`, e em producao o
  # servico nao tem essa permissao — o bucket vem do Terraform. Fazer na aplicacao daria a ela um
  # poder que ela nao deve ter, e o local deixaria de parecer com o remoto.
  #
  # O versionamento e o ponto: sem ele o S3 nao devolve `VersionId`, a `Referencia` perde a versao
  # e a deduplicacao passa a descartar reenvio legitimo como duplicata. Nada falharia — o sistema
  # so perderia documento de vez em quando. O `ArmazenamentoS3` recusa gravar sem `VersionId`, e
  # este job e o que garante que ele nao precise recusar.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: credito-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 credito credito_local_minio &&
      mc mb --ignore-existing local/credito-documentos &&
      mc version enable local/credito-documentos &&
      mc version info local/credito-documentos
      "
    restart: "no"

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.14
    container_name: credito-elasticmq
    ports:
      - "9324:9324"
    volumes:
      # As filas vem do arquivo, com a `RedrivePolicy` e a DLQ declaradas. Ver o comentario no
      # proprio arquivo sobre por que nao sao criadas pela aplicacao.
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      # `?Action=ListQueues` e nao a raiz.
      #
      # Meu primeiro palpite foi `GET /`, e ele falha: o ElasticMQ e uma API de SQS, e requisicao
      # sem `Action` nao e uma operacao valida. O compose ficou com o servico `unhealthy` enquanto
      # ele respondia 200 a chamadas de verdade — e a API nao subia por `depends_on`, apontando
      # para o lugar errado.
      #
      # `ListQueues` tambem e o check **certo** por outro motivo: ele exercita o gerenciador de
      # filas, entao um servico que subiu mas nao carregou o `elasticmq.conf` reprovaria.
      test:
        - CMD-SHELL
        - wget -q -O- "http://localhost:9324/?Action=ListQueues" >/dev/null || exit 1
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  kyc:
    build:
      # Contexto na raiz: o servico depende de `packages/plataforma`, que esta fora
      # do diretorio dele. Ver a nota no topo do Dockerfile.
      context: .
      dockerfile: services/kyc-compliance/Dockerfile
    image: kyc-compliance:dev
    container_name: credito-kyc
    profiles: ["api"]
    environment:
      KYC_AMBIENTE: local
      KYC_LOG_JSON: "true"
      KYC_OTLP_ENDPOINT: http://tempo:4318
      # Autenticacao (Camada 7). Nao ha modo desligado: sem estas duas o servico recusa
      # subir, e o `docker compose up` falha com a mensagem que traz o comando de gerar
      # as chaves.
      KYC_AUTH_CHAVE_PUBLICA_ARQUIVO: /chaves/publica.pem
      KYC_AUTH_EMISSOR: https://local.esteira-credito.invalid
    ports:
      # 8101 no host pelo mesmo motivo que a API usa 8080: evitar que o
      # Prometheus alcance o mesmo processo por dois alvos e conte em dobro.
      - "8101:8100"
    volumes:
      # Chave publica de verificacao, gerada por
      # `python -m plataforma.emissor_local gerar-chaves`. Somente leitura: o servico
      # verifica assinatura, nunca assina — se ele conseguisse escrever aqui, um
      # comprometimento poderia trocar a chave por uma que o atacante controla.
      #
      # O diretorio contem tambem a chave **privada**, que NAO e montada. Montar o diretorio
      # inteiro seria mais simples e daria ao container a capacidade de emitir token.
      - ./.chaves/publica.pem:/chaves/publica.pem:ro
    healthcheck:
      # `/ready` e nao `/health` aqui: o compose usa isto para liberar o
      # `depends_on` da API, e o que importa nesse momento e "da para consultar?",
      # que inclui ter lista carregada.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  suporte:
    build:
      context: .
      dockerfile: services/customer-support/Dockerfile
    image: customer-support:dev
    container_name: credito-suporte
    profiles: ["api"]
    environment:
      SUP_AMBIENTE: local
      SUP_LOG_JSON: "true"
      # Ollama roda no host. Modelo pequeno de proposito: a tarefa e reescrever um
      # artigo curto em linguagem simples, e o cliente esta esperando.
      SUP_OLLAMA_ENDPOINT: http://host.docker.internal:11434
      SUP_MODELO_OLLAMA: llama3.2:3b
      SUP_AUTH_CHAVE_PUBLICA_ARQUIVO: /chaves/publica.pem
      SUP_AUTH_EMISSOR: https://local.esteira-credito.invalid
    ports:
      - "8201:8200"
    volumes:
      # Chave publica de verificacao, gerada por
      # `python -m plataforma.emissor_local gerar-chaves`. Somente leitura: o servico
      # verifica assinatura, nunca assina — se ele conseguisse escrever aqui, um
      # comprometimento poderia trocar a chave por uma que o atacante controla.
      #
      # O diretorio contem tambem a chave **privada**, que NAO e montada. Montar o diretorio
      # inteiro seria mais simples e daria ao container a capacidade de emitir token.
      - ./.chaves/publica.pem:/chaves/publica.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8200/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/credit-analysis/Dockerfile
    image: credit-analysis:dev
    container_name: credito-api
    profiles: ["api"]
    environment:
      # `postgres` e nao `localhost`: dentro da rede do compose o host e o nome
      # do servico.
      CREDIT_POSTGRES_DSN: postgresql://credito:credito_local@postgres:5432/credito
      CREDIT_OTLP_ENDPOINT: http://tempo:4318
      CREDIT_AMBIENTE: local
      CREDIT_LOG_JSON: "true"
      # Ollama roda no host, nao no compose: o daemon ja esta instalado na
      # maquina e duplicar 4GB de modelo dentro de um container nao ajuda nada.
      CREDIT_OLLAMA_ENDPOINT: http://host.docker.internal:11434
      # Gate de conformidade. Dentro da rede do compose o host e o nome do
      # servico; a porta e a interna (8100), nao a publicada.
      CREDIT_KYC_URL: http://kyc:8100
      # Armazenamento e fila (Camada 8). Dentro da rede do compose os hosts sao os nomes dos
      # servicos; as portas sao as internas.
      CREDIT_BUCKET_DOCUMENTOS: credito-documentos
      CREDIT_S3_ENDPOINT: http://minio:9000
      CREDIT_FILA_EXTRACAO_URL: http://elasticmq:9324/000000000000/extracao-documentos
      CREDIT_SQS_ENDPOINT: http://elasticmq:9324
      # O boto3 exige credencial mesmo apontando para MinIO/ElasticMQ. Valores locais, iguais aos
      # do MinIO acima; o ElasticMQ ignora a credencial e exige que ela exista.
      AWS_ACCESS_KEY_ID: credito
      AWS_SECRET_ACCESS_KEY: credito_local_minio
      AWS_DEFAULT_REGION: sa-east-1
      # Trabalhador **fora** deste processo, no servico `trabalhador` abaixo.
      #
      # Ficou `true` durante a Camada 8 inteira por falta de repositorio compartilhado: sem ele,
      # a replica que publica podia nao ser a que consome, e a API estava limitada a uma replica.
      # Com o repositorio em Postgres (Camada 9) a limitacao caiu, e o valor volta ao default.
      #
      # A flag continua existindo porque ela e util em desenvolvimento — um processo em vez de
      # dois. O que ela nao e mais e a unica forma de o fluxo funcionar.
      CREDIT_TRABALHADOR_EM_PROCESSO: "false"
      CREDIT_AUTH_CHAVE_PUBLICA_ARQUIVO: /chaves/publica.pem
      CREDIT_AUTH_EMISSOR: https://local.esteira-credito.invalid
      # Credencial de servico para chamar o KYC. Vem do ambiente de quem sobe o compose:
      #
      #   export CREDIT_KYC_TOKEN=$(python -m plataforma.emissor_local token \
      #       --audiencia kyc-compliance --escopos triagens:executar)
      #
      # Sem ela o compose sobe (isto e `local`, nao `prod`) e as chamadas ao KYC sao
      # recusadas com 401 — que o disjuntor le como indisponibilidade e converte em revisao
      # humana. O log de boot avisa, e o `:-` evita que a variavel ausente quebre o parse.
      CREDIT_KYC_TOKEN: ${CREDIT_KYC_TOKEN:-}
    ports:
      # **8080 no host, e nao 8000.** Publicar em 8000 fazia o Prometheus raspar
      # o mesmo processo duas vezes: o alvo `api:8000` pela rede do compose e o
      # alvo `host.docker.internal:8000` pela porta publicada. As duas series
      # tinham valores identicos e todo `sum()` do dashboard contava em dobro —
      # um painel que mente por um fator de 2 e pior que um painel vazio.
      #
      # Com portas distintas os dois alvos ficam mutuamente exclusivos: em modo
      # container sobe `api:8000` e o alvo do host fica `down`; rodando a API no
      # host e o inverso. O Prometheus sempre ve exatamente uma fonte.
      - "8080:8000"
    volumes:
      # Cache do modelo de embedding (2,24GB). Sem este volume, cada `up`
      # rebaixaria o modelo inteiro.
      - modelo_cache:/cache
      # Chave publica de verificacao, somente leitura. A privada fica de fora: montar o
      # diretorio inteiro daria ao container a capacidade de emitir token.
      - ./.chaves/publica.pem:/chaves/publica.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      # `service_healthy` e nao `service_started`: a API tolera um KYC fora do ar
      # (as analises vao para revisao humana), mas subir sabendo que a dependencia
      # ainda nao esta pronta transformaria o primeiro minuto de operacao em
      # revisao manual desnecessaria.
      kyc:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
      # `service_completed_successfully` e nao `service_started`: sem o bucket criado **e** com
      # versionamento, a primeira gravacao levantaria `VersionamentoDesabilitado`. Esperar o job
      # terminar e o que transforma isso numa dependencia em vez de numa corrida.
      minio-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Trabalhador de extracao: consumidor de fila, sem servidor HTTP.
  #
  # ## Mesma imagem, entrypoint diferente
  #
  # `image: credit-analysis:dev` sem `build`: a imagem e a que o servico `api` constroi, e
  # duplicar o `build` faria o Compose construir duas vezes o mesmo Dockerfile. A dependencia de
  # ordem esta no `depends_on` da propria API.
  #
  # ## O que ele **nao** tem, e por que isso e o ponto
  #
  # - **sem porta publicada e sem probe HTTP.** Processo vivo nao significa consumindo, e um 200
  #   num trabalhador travado seria pior que nada. O sinal de saude e a profundidade da fila —
  #   `DocumentosPresosNaExtracao` nos alertas;
  # - **sem chave de auth montada.** Ele nao verifica token nenhum. Isto exigiu mover a exigencia
  #   de fonte de chave do validador de `Settings` para `montar_chaveiro` (Camada 9): antes,
  #   compartilhar `Settings` obrigava a montar aqui material de auth que nunca seria usado;
  # - **sem `CREDIT_KYC_URL` e sem credencial de servico.** O gate de conformidade roda na
  #   reavaliacao dentro da API; a extracao le documento e produz texto;
  # - **sem cache de modelo de embedding.** Os 2,24GB sao do RAG de politicas, que e da API.
  #
  # A soma disso e um processo com superficie menor lidando com a entrada mais exposta do sistema
  # — arquivo enviado por terceiro. E o mesmo raciocinio da politica IAM da Lambda em
  # `infra/terraform/extracao.tf`, que da a ela `GetObject` e nao `PutObject`.
  trabalhador:
    image: credit-analysis:dev
    container_name: credito-trabalhador
    profiles: ["api"]
    command: ["python", "-m", "credit_analysis.trabalhador_main"]
    environment:
      CREDIT_POSTGRES_DSN: postgresql://credito:credito_local@postgres:5432/credito
      CREDIT_AMBIENTE: local
      CREDIT_LOG_JSON: "true"
      CREDIT_BUCKET_DOCUMENTOS: credito-documentos
      CREDIT_S3_ENDPOINT: http://minio:9000
      CREDIT_FILA_EXTRACAO_URL: http://elasticmq:9324/000000000000/extracao-documentos
      CREDIT_SQS_ENDPOINT: http://elasticmq:9324
      AWS_ACCESS_KEY_ID: credito
      AWS_SECRET_ACCESS_KEY: credito_local_minio
      AWS_DEFAULT_REGION: sa-east-1
      # `fake` e nao `ollama`: o trabalhador nao gera parecer. Sem isto, `Settings` aceitaria o
      # default e o valor ficaria como uma pista falsa de que este processo fala com LLM.
      CREDIT_PROVEDOR_LLM: fake
    # Healthcheck **desligado**, e nao herdado.
    #
    # A imagem declara `HEALTHCHECK curl http://localhost:8000/health`, que existe para a API. Neste
    # container nao ha servidor HTTP nenhum, e o resultado foi medido: `Up 1 minute (unhealthy)` com
    # o trabalhador consumindo a fila normalmente.
    #
    # Um container marcado unhealthy sem nada errado e pior que nenhum healthcheck: e o sinal que
    # ensina quem opera a ignorar a coluna de status. O sinal certo para consumidor de fila e a
    # profundidade dela — `DocumentosPresosNaExtracao` em `infra/observabilidade/alertas.yml`.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # A API tambem, e por um motivo de build e nao de execucao: e ela que constroi
      # `credit-analysis:dev`. Sem isto, um `up` limpo com este servico sozinho falharia com
      # "imagem nao encontrada".
      api:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: credito-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retencao curta: e ambiente local. Em producao isso vira retencao remota
      # (Thanos, Mimir) em vez de disco maior no proprio Prometheus.
      - --storage.tsdb.retention.time=15d
      # Necessario para o Grafana recarregar regra sem reiniciar o container.
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observabilidade/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus_dados:/prometheus
    extra_hosts:
      # No Docker Desktop o `host.docker.internal` ja existe; no Linux nao. Esta
      # linha faz o scrape da API rodando no host funcionar nos dois.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.0
    container_name: credito-tempo
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"   # consulta (Grafana)
      - "4318:4318"   # OTLP/HTTP — e para ca que CREDIT_OTLP_ENDPOINT aponta
    volumes:
      - ./infra/observabilidade/tempo.yml:/etc/tempo.yml:ro
      - tempo_dados:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    container_name: credito-grafana
    environment:
      # Sem login em ambiente local: a friccao de autenticar num Grafana de
      # desenvolvimento nao compra seguranca nenhuma, e o servico nao esta
      # exposto para fora da maquina. Em producao isso vira OIDC.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Abre direto no painel provisionado em vez da home vazia.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/esteira-credito.json
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_dados:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  postgres_dados:
  # Cache do modelo de embedding, fora da imagem de proposito (ver o Dockerfile).
  modelo_cache:
  prometheus_dados:
  tempo_dados:
  grafana_dados:
  minio_dados:
