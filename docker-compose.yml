# Stack local de desenvolvimento.
#
# Sobe a stack completa: Postgres com pgvector, observabilidade (Prometheus,
# Tempo, Grafana) e a propria API.
#
# O perfil `api` deixa o servico opcional: `docker compose up -d` sobe so a
# infraestrutura (util para rodar a API do host, com reload); `--profile api`
# sobe tambem o container. Sem isso, quem esta desenvolvendo pagaria um rebuild
# de imagem a cada alteracao de codigo.
#
#   docker compose up -d
#   docker compose down -v     # -v tambem apaga os volumes de dados
#
#   API          http://localhost:8000   rodando no host
#                http://localhost:8080   rodando no compose (--profile api)
#   KYC          http://localhost:8101   servico de conformidade (--profile api)
#   Suporte      http://localhost:8201   atendimento ao cliente (--profile api)
#   Grafana      http://localhost:3000   (painel provisionado, sem login)
#   Prometheus   http://localhost:9090
#   Tempo        http://localhost:3200   (OTLP em 4318)
#
# Para o tracing chegar ao Tempo, a API precisa de:
#   CREDIT_OTLP_ENDPOINT=http://localhost:4318

name: esteira-credito

services:
  postgres:
    # Imagem oficial do pgvector sobre Postgres 17 — evita compilar a extensao.
    image: pgvector/pgvector:pg17
    container_name: credito-postgres
    environment:
      POSTGRES_USER: credito
      POSTGRES_PASSWORD: credito_local
      POSTGRES_DB: credito
      # Acelera testes: sem fsync a cada commit. Aceitavel porque perder este
      # banco custa um `docker compose down -v` seguido de reingestao.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    ports:
      - "5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
      # Scripts de initdb rodam automaticamente, em ordem alfabetica, apenas na
      # primeira subida (diretorio de dados vazio).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # Montado fora do initdb.d porque e aplicado duas vezes pelo script —
      # uma em `credito`, outra em `credito_test`.
      - ./infra/postgres/schema.sql:/schema.sql:ro
    healthcheck:
      # `pg_isready` responde antes de o initdb terminar; consultar a extensao
      # garante que o schema esta pronto de verdade antes de o teste conectar.
      # `-tAc` devolve o valor cru (sem cabecalho nem alinhamento), o que torna
      # o `grep` confiavel.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U credito -d credito &&
          psql -U credito -d credito -tAc
          "SELECT 1 FROM pg_extension WHERE extname='vector'" | grep -q 1
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kyc:
    build:
      # Contexto na raiz: o servico depende de `packages/plataforma`, que esta fora
      # do diretorio dele. Ver a nota no topo do Dockerfile.
      context: .
      dockerfile: services/kyc-compliance/Dockerfile
    image: kyc-compliance:dev
    container_name: credito-kyc
    profiles: ["api"]
    environment:
      KYC_AMBIENTE: local
      KYC_LOG_JSON: "true"
      KYC_OTLP_ENDPOINT: http://tempo:4318
    ports:
      # 8101 no host pelo mesmo motivo que a API usa 8080: evitar que o
      # Prometheus alcance o mesmo processo por dois alvos e conte em dobro.
      - "8101:8100"
    healthcheck:
      # `/ready` e nao `/health` aqui: o compose usa isto para liberar o
      # `depends_on` da API, e o que importa nesse momento e "da para consultar?",
      # que inclui ter lista carregada.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  suporte:
    build:
      context: .
      dockerfile: services/customer-support/Dockerfile
    image: customer-support:dev
    container_name: credito-suporte
    profiles: ["api"]
    environment:
      SUP_AMBIENTE: local
      SUP_LOG_JSON: "true"
      # Ollama roda no host. Modelo pequeno de proposito: a tarefa e reescrever um
      # artigo curto em linguagem simples, e o cliente esta esperando.
      SUP_OLLAMA_ENDPOINT: http://host.docker.internal:11434
      SUP_MODELO_OLLAMA: llama3.2:3b
    ports:
      - "8201:8200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8200/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/credit-analysis/Dockerfile
    image: credit-analysis:dev
    container_name: credito-api
    profiles: ["api"]
    environment:
      # `postgres` e nao `localhost`: dentro da rede do compose o host e o nome
      # do servico.
      CREDIT_POSTGRES_DSN: postgresql://credito:credito_local@postgres:5432/credito
      CREDIT_OTLP_ENDPOINT: http://tempo:4318
      CREDIT_AMBIENTE: local
      CREDIT_LOG_JSON: "true"
      # Ollama roda no host, nao no compose: o daemon ja esta instalado na
      # maquina e duplicar 4GB de modelo dentro de um container nao ajuda nada.
      CREDIT_OLLAMA_ENDPOINT: http://host.docker.internal:11434
      # Gate de conformidade. Dentro da rede do compose o host e o nome do
      # servico; a porta e a interna (8100), nao a publicada.
      CREDIT_KYC_URL: http://kyc:8100
    ports:
      # **8080 no host, e nao 8000.** Publicar em 8000 fazia o Prometheus raspar
      # o mesmo processo duas vezes: o alvo `api:8000` pela rede do compose e o
      # alvo `host.docker.internal:8000` pela porta publicada. As duas series
      # tinham valores identicos e todo `sum()` do dashboard contava em dobro —
      # um painel que mente por um fator de 2 e pior que um painel vazio.
      #
      # Com portas distintas os dois alvos ficam mutuamente exclusivos: em modo
      # container sobe `api:8000` e o alvo do host fica `down`; rodando a API no
      # host e o inverso. O Prometheus sempre ve exatamente uma fonte.
      - "8080:8000"
    volumes:
      # Cache do modelo de embedding (2,24GB). Sem este volume, cada `up`
      # rebaixaria o modelo inteiro.
      - modelo_cache:/cache
    depends_on:
      postgres:
        condition: service_healthy
      # `service_healthy` e nao `service_started`: a API tolera um KYC fora do ar
      # (as analises vao para revisao humana), mas subir sabendo que a dependencia
      # ainda nao esta pronta transformaria o primeiro minuto de operacao em
      # revisao manual desnecessaria.
      kyc:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: credito-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retencao curta: e ambiente local. Em producao isso vira retencao remota
      # (Thanos, Mimir) em vez de disco maior no proprio Prometheus.
      - --storage.tsdb.retention.time=15d
      # Necessario para o Grafana recarregar regra sem reiniciar o container.
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observabilidade/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus_dados:/prometheus
    extra_hosts:
      # No Docker Desktop o `host.docker.internal` ja existe; no Linux nao. Esta
      # linha faz o scrape da API rodando no host funcionar nos dois.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.0
    container_name: credito-tempo
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"   # consulta (Grafana)
      - "4318:4318"   # OTLP/HTTP — e para ca que CREDIT_OTLP_ENDPOINT aponta
    volumes:
      - ./infra/observabilidade/tempo.yml:/etc/tempo.yml:ro
      - tempo_dados:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    container_name: credito-grafana
    environment:
      # Sem login em ambiente local: a friccao de autenticar num Grafana de
      # desenvolvimento nao compra seguranca nenhuma, e o servico nao esta
      # exposto para fora da maquina. Em producao isso vira OIDC.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Abre direto no painel provisionado em vez da home vazia.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/esteira-credito.json
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_dados:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  postgres_dados:
  # Cache do modelo de embedding, fora da imagem de proposito (ver o Dockerfile).
  modelo_cache:
  prometheus_dados:
  tempo_dados:
  grafana_dados:
