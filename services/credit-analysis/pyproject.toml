[project]
name = "credit-analysis"
version = "0.1.0"
description = "Analise automatizada de documentos de credito com OCR, RAG e agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "pandas>=2.2",
    "structlog>=24.4",
    # Infraestrutura tecnica compartilhada do monorepo (logging, seguranca, BM25,
    # cliente Ollama). Dependencia de caminho: no monorepo o codigo e resolvido do
    # disco, sem publicar pacote. Ver packages/plataforma/README.md.
    # `metricas` entrou quando este servico passou a usar `rotulo_de_rota` e os
    # buckets da biblioteca em vez das copias locais. `prometheus-client` ja era
    # dependencia direta, mas declarar o extra deixa a intencao explicita: sem ele um
    # `uv sync` futuro poderia resolver a plataforma sem o modulo e o import quebraria.
    "plataforma[llm,metricas]",
    # RAG: embeddings locais via ONNX (sem torch) e parsing do front-matter.
    "fastembed>=0.4",
    "pyyaml>=6.0",
    # OCR e processamento de documento.
    "pytesseract>=0.3.13",
    "opencv-python-headless>=4.10",
    "pymupdf>=1.24",
    # Upload multipart no FastAPI.
    "python-multipart>=0.0.9",
    # LLM e visao.
    "langchain-anthropic>=1.0",
    # LLM local: sem chave, sem conta, e o dado nao sai da infraestrutura.
    "langchain-ollama>=1.0",
    # Agente com ferramentas (Camada 4).
    "langgraph>=1.0",
    # Observabilidade (Camada 5): metricas e tracing.
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    # Cliente HTTP do servico de KYC. Sai de `dev` para dependencia principal:
    # antes era usado apenas pelo TestClient, agora roda em producao.
    "httpx>=0.27",
    # Vector store persistente.
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[tool.uv.sources]
plataforma = { path = "../../packages/plataforma", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_analysis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Evals ficam fora da execucao padrao: baixam 2,24GB de modelo. Rode com
# `pytest -m eval` (a CI roda num job separado, com cache do modelo).
addopts = "-q --strict-markers -m 'not eval and not ocr'"
asyncio_mode = "auto"
markers = [
    "integration: testes que exercitam a API completa",
    "eval: avaliacao de qualidade do retrieval; exige o modelo de embedding real",
    "ocr: avaliacao de acuracia de OCR; exige o Tesseract instalado",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Inclui as regras de seguranca (`S`, do bandit) e as de encapsulamento (`BLE`,
# `SLF`). Elas entraram depois, quando o `kyc-compliance` nasceu com esse conjunto
# e a diferenca de regua entre os dois servicos ficou evidente — duas reguas num
# mesmo monorepo significa que o codigo mais novo e mais seguro por acidente, e
# nao por politica.
#
# O que elas encontraram, e o que foi feito:
#
#   S310  urlopen sobre endpoint configuravel sem validar o esquema. **Achado
#         legitimo**, corrigido de verdade: `_validar_endpoint` recusa qualquer
#         coisa que nao seja http/https, porque `file:///etc/passwd/api/version`
#         faria a checagem de disponibilidade ler arquivo local.
#   S608  SQL montado com f-string em `pgvector_store`. **Falso positivo**,
#         verificado: interpola apenas a constante `_COLUNAS`, e todo valor de
#         dado entra por bind parameter `%(nome)s`. Ignorado por arquivo abaixo.
#   S101  `assert` em `src`. Sao estreitamentos de tipo depois de validacao
#         Pydantic, nao garantias de runtime. Ignorados por arquivo.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "BLE", "SLF"]
ignore = [
    # S101: `assert`. E a forma de escrever teste em pytest, e em `src` os poucos
    # asserts que existem sao estreitamento de tipo depois de validacao Pydantic —
    # se o Python rodar com -O eles desaparecem e o codigo continua correto,
    # porque nao carregam garantia de negocio.
    "S101",
    # RUF001-003: caracteres "ambiguos" (acentos, travessao) em strings e
    # comentarios. O dominio e escrito em portugues; a regra e ruido aqui.
    "RUF001",
    "RUF002",
    "RUF003",
    # N818: exige sufixo "Error" em excecao. A linguagem ubiqua do dominio e
    # portugues (ErroDominio, ValorInvalido); misturar sufixo em ingles so
    # para satisfazer a regra deixaria o vocabulario inconsistente.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# S608 verificado linha por linha: o f-string interpola somente `_COLUNAS`,
# constante de modulo com a lista fixa de colunas; todo valor de dado entra por
# bind parameter `%(nome)s`, que o psycopg envia separado do texto da consulta.
#
# O `noqa` inline nao serve neste caso: o diagnostico aponta para a **abertura** de
# uma string multilinha, e o comentario cairia dentro do SQL — onde `#` nao e
# comentario em PostgreSQL. Descobri isso quebrando a consulta.
"src/credit_analysis/infrastructure/rag/pgvector_store.py" = ["S608"]

# Leitura de atributo interno, com a justificativa no proprio codigo: o nome da
# metrica no `prometheus_client` e o `_compilar` do agente, usado para desenhar o
# grafo em Mermaid.
"src/credit_analysis/infrastructure/observabilidade/metricas.py" = ["SLF001"]
"src/credit_analysis/infrastructure/agente/grafo.py" = ["SLF001"]

# Gerador de documento sintetico: `random` com seed fixa, para que o eval de OCR
# seja comparavel entre execucoes. Nao ha uso criptografico.
"tests/apoio/documentos_sinteticos.py" = ["S311"]
"tests/**" = ["SLF001", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

# Bibliotecas sem py.typed. `fastembed` e `pytesseract` sao wrappers finos e
# `fitz` (PyMuPDF) expoe binding C — nenhuma publica stub. Os pontos de contato
# ficam confinados aos adapters, e o tipo volta a ser conhecido na fronteira do
# port.
[[tool.mypy.overrides]]
module = ["fitz.*", "pytesseract.*", "fastembed.*"]
ignore_missing_imports = true
