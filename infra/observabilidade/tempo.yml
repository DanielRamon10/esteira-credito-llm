# Grafana Tempo em modo monolitico com armazenamento local.
#
# Escolhido em vez do Jaeger porque o Grafana provisiona Prometheus e Tempo com
# o mesmo mecanismo, e porque o Tempo correlaciona trace com metrica nativamente
# (o `tracesToMetrics` do datasource) — que e exatamente a ponte necessaria para
# ir de "o p95 subiu" para "este trace mostra por que".

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Retencao curta: e ambiente local, e trace de desenvolvimento nao precisa
# sobreviver a semana.
compactor:
  compaction:
    block_retention: 24h
