# Regras de alerta.
#
# O critério para uma regra entrar aqui: **alguem precisa agir quando ela
# dispara**. Alerta que nao gera acao treina o time a ignorar alerta, e um time
# que ignora alerta e pior que um time sem alertas — porque acredita estar
# coberto.
#
# Por isso nao ha alerta de "latencia do LLM alta": 80s e o normal medido deste
# sistema em CPU, e alertar sobre o esperado e ruido.

groups:
  - name: guardrails-de-ia
    interval: 30s
    rules:
      # A metrica de alucinacao prometida desde a Camada 2.
      - alert: CitacoesRejeitadasAlta
        expr: |
          sum(rate(credito_citacoes_total{estado="rejeitada"}[15m]))
            /
          clamp_min(sum(rate(credito_citacoes_total[15m])), 0.001)
            > 0.2
        for: 10m
        labels:
          severidade: aviso
          dominio: ia
        annotations:
          resumo: "Mais de 20% das citacoes estao sendo rejeitadas pelo guardrail"
          acao: >-
            O modelo comecou a parafrasear em vez de copiar. Verificar se houve
            troca de modelo, mudanca de prompt ou atualizacao do Ollama.
            `clamp_min` no denominador evita divisao por zero quando nao ha
            trafego — sem ele a expressao vira NaN e o alerta nunca dispara.

      # Tentativa de injecao nao e curiosidade: e indicio de fraude.
      - alert: TentativaDeInjecaoDetectada
        expr: sum(increase(credito_injecao_detectada_total[10m])) > 0
        for: 0m
        labels:
          severidade: critico
          dominio: seguranca
        annotations:
          resumo: "Prompt injection detectada em conteudo nao confiavel"
          acao: >-
            Sem `for`, de proposito: uma unica tentativa precisa ser investigada.
            Correlacionar pelo `analise_id` no log estruturado e encaminhar para
            a area de fraude.

      - alert: AgenteInterrompidoComFrequencia
        expr: |
          sum(rate(credito_agente_atendimentos_total{motivo_parada!="respondeu"}[15m]))
            /
          clamp_min(sum(rate(credito_agente_atendimentos_total[15m])), 0.001)
            > 0.3
        for: 15m
        labels:
          severidade: aviso
          dominio: ia
        annotations:
          resumo: "Mais de 30% dos atendimentos do agente nao chegam ao fim"
          acao: >-
            Teto de passos ou orcamento de tempo sendo atingido demais. Ver a
            distribuicao de `credito_agente_passos`: concentracao no teto indica
            loop de ferramenta, nao pergunta difícil.

  - name: guardrails-do-atendimento
    interval: 30s
    rules:
      # O par de alertas mais importante do customer-support, e eles vem em par de
      # proposito: um mede o guard trabalhando demais, o outro mede o guard tendo
      # parado de trabalhar. Sozinho, cada um deixa passar metade do problema.
      - alert: VazamentoDeConteudoInternoAlto
        expr: |
          sum(rate(suporte_vazamentos_bloqueados_total[15m]))
            /
          clamp_min(sum(rate(suporte_atendimentos_total[15m])), 0.001)
            > 0.15
        for: 10m
        labels:
          severidade: aviso
          dominio: ia
        annotations:
          resumo: "Mais de 15% das respostas ao cliente estao sendo descartadas pelo guard"
          acao: >-
            O modelo passou a produzir conteudo interno. As causas possiveis sao
            poucas e todas acionaveis: troca de modelo, mudanca de prompt, ou um
            artigo publico que passou a citar numero interno. O label `categoria`
            separa os tres casos — `limiar_de_score` aponta para o modelo,
            `referencia_politica_interna` costuma apontar para o corpus.

      # A contrapartida, e o alerta menos obvio dos dois: guard que para de bloquear
      # nao e boa noticia por si so. Pode ser o padrao tendo deixado de casar depois de
      # uma refatoracao — exatamente o que aconteceu com `limiar_de_score`, que na
      # primeira versao nao pegava "abaixo de 700" nem numero longe da palavra.
      #
      # Por isso a condicao exige trafego (`> 50` atendimentos): sem ela, um periodo de
      # baixo volume dispararia o alerta a noite, todas as noites.
      - alert: GuardDeDivulgacaoSilencioso
        expr: |
          sum(increase(suporte_atendimentos_total{origem="modelo"}[6h])) > 50
            and
          sum(increase(suporte_vazamentos_bloqueados_total[6h])) == 0
        for: 30m
        labels:
          severidade: aviso
          dominio: ia
        annotations:
          resumo: "Volume normal de resposta gerada, e nenhum bloqueio em 6h"
          acao: >-
            Pode ser legitimo, mas verificar se algum padrao de
            `divulgacao._PADROES` parou de casar depois de mudanca de codigo. O
            eval `test_vazamento` roda contra o corpus real e e o primeiro lugar
            para checar.

      - alert: InjecaoNaMensagemDoCliente
        expr: sum(increase(suporte_injecao_detectada_total[10m])) > 0
        for: 0m
        labels:
          severidade: aviso
          dominio: seguranca
        annotations:
          resumo: "Padrao de injecao detectado na mensagem do proprio cliente"
          acao: >-
            Severidade **aviso**, e nao critico como no credit-analysis, e a
            diferenca e deliberada: la o conteudo vem de documento enviado e uma
            injecao e indicio de fraude; aqui vem de um canal aberto ao publico,
            onde chega curiosidade e teste. O roteamento e deterministico e fora
            do prompt, logo a injecao nao muda a decisao — o que se mede e
            volume, para detectar sondagem sistematica.

      - alert: FilaDeOuvidoriaCrescendo
        expr: sum(rate(suporte_encaminhamentos_total{motivo="ouvidoria"}[30m])) * 1800 > 15
        for: 30m
        labels:
          severidade: aviso
          dominio: operacao
        annotations:
          resumo: "Mais de 15 reclamacoes encaminhadas a ouvidoria por 30min"
          acao: >-
            A Resolucao CMN 4.860 da prazo de resposta, e prazo legal exige
            dimensionar a fila antes de estourar. `motivo="vazamento_sem_texto_seguro"`
            e uma fila diferente, de engenharia, e nao entra nesta conta.

  - name: guardrails-de-conformidade
    interval: 30s
    rules:
      # O equivalente, no KYC, da taxa de citacao rejeitada: mede o casamento de nomes
      # ficando mais frouxo. Fila de revisao manual e custo de gente, e cresce sem que
      # nada no servico pareca errado.
      - alert: RevisaoManualDeKycAcumulando
        expr: |
          sum(rate(kyc_triagens_total{decisao="revisao_manual"}[30m]))
            /
          clamp_min(sum(rate(kyc_triagens_total[30m])), 0.001)
            > 0.25
        for: 20m
        labels:
          severidade: aviso
          dominio: conformidade
        annotations:
          resumo: "Mais de 25% das triagens caindo em revisao manual"
          acao: >-
            Cruzar com `kyc_correspondencias_total{nivel}`: deslocamento de
            `forte` para `parcial` indica lista com nomes mais abreviados que
            antes, nao aumento real de risco. Casamento so por CPF tambem cai
            aqui, por decisao do dominio.

      # O cenario perigoso deste servico: sem lista, ele aprova todo mundo relatando
      # "nenhuma correspondencia". O `/ready` reprova e o pod sai do balanceador, mas o
      # alerta existe porque a mesma condicao pode aparecer degradada — lista carregada
      # pela metade depois de uma atualizacao parcial.
      - alert: ListaRestritivaEncolheu
        expr: |
          histogram_quantile(0.5, sum(rate(kyc_entradas_avaliadas_bucket[30m])) by (le))
            < 10
        for: 10m
        labels:
          severidade: critico
          dominio: conformidade
        annotations:
          resumo: "As triagens estao avaliando menos de 10 entradas de lista"
          acao: >-
            Aprovacao em massa por lista vazia e o pior modo de falha deste
            servico, porque ele nao **parece** quebrado: responde 201, com
            `correspondencias: []`. Verificar a origem do CSV e o log
            `listas.carregadas`.

  - name: extracao-assincrona
    interval: 30s
    rules:
      # Documento parado em estado nao-terminal.
      #
      # E o alerta que pega o modo de falha em aberto da recepcao: se o `publicar` falhar com o
      # documento ja gravado, ele fica `recebido` para sempre. Nada mais no sistema o corrigiria, e
      # o cliente veria "processando" indefinidamente.
      #
      # A expressao compara recebidos com concluidos: a diferenca **e** o que ficou pendente. Um
      # unico contador no fim mediria vazao e nao diria nada sobre acumulo — e acumulo silencioso e
      # o modo de falha proprio de fila.
      - alert: DocumentosPresosNaExtracao
        expr: |
          sum(increase(credito_documentos_recebidos_total[30m]))
            -
          sum(increase(credito_extracoes_total[30m]))
            > 5
        for: 15m
        labels:
          severidade: aviso
          dominio: operacao
        annotations:
          resumo: "Mais de 5 documentos recebidos sem extracao concluida em 30min"
          acao: >-
            Conferir se o trabalhador esta consumindo (`credito_extracoes_total`
            parado) e se a fila tem mensagem. O trabalhador e um processo/pod
            separado a partir da Camada 9: `up{servico="credit-analysis-trabalhador"}`
            diz se ele esta no ar, e `ServicoForaDoAr` alerta se cair. Com Lambda,
            ver o alarme de DLQ no CloudWatch.

      # Contrapartida do alerta acima, e ela existe por causa de um defeito medido.
      #
      # Ao separar o trabalhador da API, `credito_extracoes_total` deixou de ser raspado — o
      # trabalhador nao tinha `/metrics`. E `DocumentosPresosNaExtracao` faz `recebidos -
      # extracoes`, uma operacao entre vetor e vetor **vazio**, cujo resultado em PromQL e vazio.
      #
      # Ou seja: o alerta que detecta trabalhador parado ficou permanentemente silencioso no exato
      # momento em que o trabalhador virou um processo que pode parar sozinho. Nada indicava isso —
      # a regra continuava valida, a query nao dava erro, o painel so ficava vazio.
      #
      # `absent()` e a unica forma de alertar sobre **ausencia** de serie: qualquer expressao que
      # tente comparar uma serie ausente herda o vazio dela.
      - alert: MetricaDeExtracaoAusente
        expr: absent(credito_extracoes_total)
        # 30m e nao 5m: a serie so aparece depois da primeira extracao concluida, e um ambiente
        # recem-subido legitimamente nao tem nenhuma. Menos que isso alertaria em todo `up`.
        for: 30m
        labels:
          severidade: aviso
          dominio: observabilidade
        annotations:
          resumo: "`credito_extracoes_total` nao existe no Prometheus"
          acao: >-
            Enquanto esta serie nao existe, `DocumentosPresosNaExtracao` **nao
            pode disparar** — comparar com vetor ausente da vetor vazio. Conferir
            o alvo `credit-analysis-trabalhador` em /targets: provavel trabalhador
            fora do ar desde o boot, endpoint de metricas nao subindo, ou o job
            removido do `prometheus.yml`.

      - alert: ExtracoesFalhandoMuito
        expr: |
          sum(rate(credito_extracoes_total{desfecho="falhou"}[15m]))
            /
          clamp_min(sum(rate(credito_extracoes_total[15m])), 0.001)
            > 0.2
        for: 10m
        labels:
          severidade: aviso
          dominio: operacao
        annotations:
          resumo: "Mais de 20% das extracoes terminando em falha permanente"
          acao: >-
            Falha permanente e arquivo ilegivel ou referencia invalida — nao e
            problema de capacidade. Um salto costuma indicar mudanca no que o
            canal esta enviando, nao no servico. Ver `documento.falhou` no log.

      # Reentrega, e por que ela tem alerta proprio.
      #
      # `ja_aplicada` subindo significa que o trabalhador esta morrendo **entre aplicar e
      # confirmar**: o trabalho e feito, a mensagem volta, e a idempotencia impede o dano. O
      # sistema parece saudavel — os documentos ficam `extraido` — e esta pagando OCR duas vezes.
      #
      # Sem esta metrica isso seria invisivel ate a conta chegar.
      - alert: ReentregaAlta
        expr: |
          sum(rate(credito_extracoes_total{desfecho="ja_aplicada"}[30m]))
            /
          clamp_min(sum(rate(credito_extracoes_total[30m])), 0.001)
            > 0.1
        for: 15m
        labels:
          severidade: aviso
          dominio: operacao
        annotations:
          resumo: "Mais de 10% das extracoes sao reaplicacao de trabalho ja feito"
          acao: >-
            O trabalhador esta morrendo entre aplicar e confirmar, ou a
            visibilidade da fila (300s) e menor que a extracao mais lenta. O
            sistema nao perde dado, e paga OCR duas vezes.

  - name: disponibilidade
    interval: 30s
    rules:
      # `max by (servico)` e nao `up == 0`, e a diferenca corrige um defeito que a versao
      # anterior desta regra tinha desde a Camada 5.
      #
      # Cada servico e raspado por **dois** alvos, um para execucao em container e um
      # para execucao no host, e eles sao mutuamente exclusivos por construcao: sempre
      # um dos dois esta `down`. Com `up == 0` por alvo, a regra dispararia
      # permanentemente em desenvolvimento — e o cabecalho deste arquivo diz que alerta
      # que nao gera acao treina o time a ignorar alerta. Era o caso.
      #
      # `max by (servico)` colapsa os alvos de um mesmo servico: o alerta so dispara
      # quando **nenhum** modo de execucao responde, que e a condicao que realmente
      # significa "fora do ar". O `servico!=""` exclui o job do proprio Prometheus, que
      # nao tem esse label.
      - alert: ServicoForaDoAr
        expr: max by (servico) (up{servico!=""}) == 0
        for: 2m
        labels:
          severidade: critico
        annotations:
          resumo: "O servico {{ $labels.servico }} nao responde por nenhum alvo"

      - alert: TaxaDeErro5xx
        expr: |
          sum(rate(credito_http_requisicoes_total{status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(credito_http_requisicoes_total[5m])), 0.001)
            > 0.05
        for: 5m
        labels:
          severidade: critico
        annotations:
          resumo: "Mais de 5% das requisicoes falhando com 5xx"

      - alert: RevisaoHumanaAcumulando
        expr: sum(rate(credito_revisao_humana_total[30m])) * 1800 > 20
        for: 30m
        labels:
          severidade: aviso
          dominio: operacao
        annotations:
          resumo: "Fila de revisao humana crescendo mais de 20 casos por 30min"
          acao: >-
            Pode ser degradacao de OCR (ver `credito_ocr_confianca_pct`) ou
            aumento real de documento ruim. A distribuicao de
            `credito_revisao_humana_total` por `motivo` separa os dois casos.
