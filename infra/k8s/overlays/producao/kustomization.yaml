# Overlay de producao.
#
# O que muda em relacao a base e pouco de proposito: quanto mais um overlay reescreve,
# menos a base representa o que roda de verdade — e ai o `kubectl apply -k base` deixa de
# ser um teste util.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: credito

resources:
  - ../../base

images:
  # As tags sao substituidas pelo CI com o SHA do commit. Tag imutavel e nao `latest`:
  # com `latest`, dois pods do mesmo Deployment podem rodar codigo diferente (o que foi
  # baixado antes e depois de um push), e o sintoma e um bug que aparece em metade das
  # requisicoes.
  - name: credit-analysis
    newName: 000000000000.dkr.ecr.sa-east-1.amazonaws.com/credit-analysis
    newTag: PREENCHIDO_PELO_CI
  - name: kyc-compliance
    newName: 000000000000.dkr.ecr.sa-east-1.amazonaws.com/kyc-compliance
    newTag: PREENCHIDO_PELO_CI
  - name: customer-support
    newName: 000000000000.dkr.ecr.sa-east-1.amazonaws.com/customer-support
    newTag: PREENCHIDO_PELO_CI

# As contagens diferem porque as cargas nao tem relacao entre si: uma analise de credito
# nao gera um atendimento, e um atendimento nao gera uma triagem. Dimensionar os tres
# igual seria tratar como acoplado o que foi separado justamente por nao ser.
replicas:
  - name: credit-analysis
    count: 3
  - name: kyc-compliance
    count: 2
  - name: customer-support
    count: 3

patches:
  # --------------------------------------------------------- credit-analysis
  # Producao pede mais memoria: com tres replicas atendendo simultaneamente, o pico de
  # uso do modelo de embedding mais o buffer de OCR passam do limite de 3Gi da base.
  - target:
      kind: Deployment
      name: credit-analysis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # --------------------------------------------------------------- os tres
  # Espalha as replicas por zona. Sem isto, o scheduler pode colocar todas no mesmo no —
  # e uma manutencao de no leva o servico inteiro, tornando o PDB inutil.
  #
  # O patch e repetido por servico em vez de aplicado por `kind: Deployment` sem nome: um
  # target sem nome casaria os tres, mas o `labelSelector` interno precisa nomear o
  # servico especifico. Um selector generico espalharia os pods dos tres servicos como se
  # fossem um grupo, o que nao garante nada para nenhum deles.
  - target:
      kind: Deployment
      name: credit-analysis
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: credit-analysis

  - target:
      kind: Deployment
      name: kyc-compliance
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kyc-compliance

  - target:
      kind: Deployment
      name: customer-support
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: customer-support
