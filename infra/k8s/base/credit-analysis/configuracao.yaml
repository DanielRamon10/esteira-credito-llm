# Service, ConfigMap e Secret.
#
# ConfigMap e Secret ficam separados porque ConfigMap aparece inteiro em
# `kubectl describe` e em log de auditoria. Misturar os dois faria com que uma
# consulta rotineira exibisse credencial.
apiVersion: v1
kind: Service
metadata:
  name: credit-analysis
  labels:
    app.kubernetes.io/name: credit-analysis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: credit-analysis
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: credit-analysis-config
data:
  CREDIT_AMBIENTE: "prod"
  CREDIT_LOG_JSON: "true"
  CREDIT_NIVEL_LOG: "INFO"
  # Documentacao interativa fechada em producao: ela expoe o schema completo da
  # API, que e material de reconhecimento para quem procura superficie.
  CREDIT_DOCS_HABILITADOS: "false"

  CREDIT_MODELO_EMBEDDING: "intfloat/multilingual-e5-large"
  CREDIT_TRECHOS_POR_CONSULTA: "5"

  # `ollama` e nao `auto`, e esta e a linha mais importante deste arquivo. Com
  # `auto`, um Ollama indisponivel faria o servico cair no fake deterministico e
  # responder parecer com texto inventado. Explicito, ele falha ao subir — o pod
  # nao passa no readiness, o rollout para, e ninguem recebe parecer falso.
  CREDIT_PROVEDOR_LLM: "ollama"
  CREDIT_OLLAMA_ENDPOINT: "http://ollama.ia.svc.cluster.local:11434"
  CREDIT_MODELO_OLLAMA: "llama3.1:8b"
  # Modelo do agente diferente do da fundamentacao, por medicao (ver o cabecalho
  # de infrastructure/agente/grafo.py).
  CREDIT_MODELO_AGENTE: "qwen2.5:7b"
  CREDIT_AGENTE_MAX_PASSOS: "6"
  CREDIT_AGENTE_TIMEOUT_SEGUNDOS: "180"

  # Gate de conformidade. **Estava ausente deste ConfigMap**, e a falta era silenciosa:
  # `kyc_url` tem default `""`, e com string vazia o `_montar_kyc` monta o cliente fake.
  # Ou seja, em Kubernetes a esteira rodaria sem consultar lista de sancoes e sem nada
  # falhar — o pior tipo de defeito de conformidade, porque o parecer sai com aparencia
  # de completo.
  #
  # O manifest foi escrito antes de o gate existir e nunca foi revisitado. Vale como
  # lembrete de que manifest nao tem teste: as 389 provas do servico passavam.
  #
  # A porta e a do container (8100), nao a do Service (80): o `credit-analysis` fala com
  # o Service, que redireciona para `targetPort: http`. Aqui vale o nome do Service e a
  # porta **dele**.
  CREDIT_KYC_URL: "http://kyc-compliance.credito.svc.cluster.local"
  CREDIT_KYC_TIMEOUT_SEGUNDOS: "3.0"
  CREDIT_KYC_TENTATIVAS: "2"

  # Autenticacao (Camada 7). Nao ha `CREDIT_AUTH_HABILITADO`: sem uma fonte de chave o
  # servico recusa subir, e o rollout do Kubernetes mantem os pods antigos no ar — que e o
  # comportamento certo diante de configuracao incompleta.
  #
  # O caminho aponta para o Secret montado no Deployment. Em producao com IdP, trocar por
  # `CREDIT_AUTH_JWKS_URL` e remover o volume: JWKS permite rotacao sem tocar no manifest.
  CREDIT_AUTH_CHAVE_PUBLICA_ARQUIVO: "/chaves/publica.pem"
  CREDIT_AUTH_EMISSOR: "https://idp.interno.invalid"

  CREDIT_OTLP_ENDPOINT: "http://tempo.observabilidade.svc.cluster.local:4318"
  CREDIT_TRACE_AMOSTRAGEM: "1.0"
---
# Placeholder de ESTRUTURA, com valores vazios.
#
# Este arquivo declara quais chaves o Deployment espera; nunca carrega valor
# real. Secret do Kubernetes e base64, nao criptografia — qualquer um com `get
# secret` le o conteudo. Em producao o valor vem do AWS Secrets Manager via
# External Secrets Operator (ver infra/terraform/), e este objeto e substituido.
#
# O hook de pre-commit do repositorio bloqueia commit com formato de chave, o que
# torna difícil preencher isto por acidente.
apiVersion: v1
kind: Secret
metadata:
  name: credit-analysis-secrets
type: Opaque
stringData:
  CREDIT_POSTGRES_DSN: ""
  CREDIT_ANTHROPIC_API_KEY: ""
---
# Chave publica de verificacao de token.
#
# **Secret e nao ConfigMap**, apesar de a chave ser publica. Duas razoes:
#
# - montagem como volume permite rotacao sem recriar o pod (o kubelet propaga a mudanca em
#   segundos), enquanto variavel de ambiente e fixada na criacao do container;
# - em producao este objeto e substituido pelo External Secrets Operator, que sincroniza do
#   AWS Secrets Manager — e ele produz Secrets, nao ConfigMaps. Manter o tipo evita uma
#   migracao no dia em que houver material sensivel aqui (uma chave de assinatura, por
#   exemplo, se este servico algum dia emitir algo).
#
# Placeholder de **estrutura**, com valor vazio. O hook de pre-commit bloqueia PEM, o que
# torna dificil preencher isto por acidente.
apiVersion: v1
kind: Secret
metadata:
  name: credit-analysis-auth
type: Opaque
stringData:
  publica.pem: ""
