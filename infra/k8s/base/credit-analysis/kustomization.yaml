# Componente do credit-analysis.
#
# Kustomize e nao Helm nesta escala: tres servicos com dois ambientes nao precisam de
# templating com condicional e loop. Kustomize aplica patch sobre YAML valido, o que
# significa que a base pode ser lida e validada como manifest de verdade — um chart Helm
# com `{{ if }}` no meio nao pode.
#
# Helm passaria a valer com muitos servicos parecidos ou distribuicao para terceiros;
# nenhum dos dois e o caso aqui.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - configuracao.yaml
  - resiliencia.yaml
  # Consumidor da fila de extracao, Deployment proprio a partir da Camada 9. Compartilha o
  # ConfigMap e o Secret da API porque a configuracao **e** a mesma (mesmo banco, mesmo bucket,
  # mesma fila); o que difere e o comando e o que o pod monta.
  - trabalhador.yaml
