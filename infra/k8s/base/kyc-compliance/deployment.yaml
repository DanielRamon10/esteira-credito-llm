# Deployment do kyc-compliance.
#
# ## O contraste com o credit-analysis, que e o que vale explicar aqui
#
# Este servico nao carrega modelo, nao fala com banco e nao chama LLM: a triagem e
# comparacao de string em memoria contra listas assadas na imagem. A consequencia
# aparece em cada numero deste arquivo â€” 256Mi de request contra 1Gi, `startupProbe` de
# 30s contra 2 minutos, nenhum volume de cache de 4Gi.
#
# Vale registrar porque e o argumento pratico do custo de um modelo de embedding: o
# mesmo cluster roda muito mais replicas deste servico com o mesmo hardware.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-compliance
  labels:
    app.kubernetes.io/name: kyc-compliance
    app.kubernetes.io/component: api
spec:
  replicas: 2
  # `maxUnavailable: 0` mesmo com boot rapido, e o motivo aqui e diferente do do
  # credit-analysis: nao e o custo de subir, e o fato de este servico ser **dependencia
  # sincrona** de outro. O `credit-analysis` tem disjuntor e degrada para revisao humana
  # quando o KYC nao responde, mas transformar um rollout de rotina em fila de analista
  # seria escolher trabalho manual por conveniencia de deploy.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyc-compliance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyc-compliance
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8100"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: kyc-compliance:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: kyc-compliance-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Um unico ponto de escrita, contra dois do credit-analysis: nao ha cache de
          # modelo nem upload de documento. Se aparecer um segundo, e sinal de que algo
          # passou a gravar onde nao devia.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Liveness no /health, readiness no /ready, e aqui a distincao e a mais
          # importante de todo o projeto.
          #
          # O `/ready` deste servico **reprova quando a lista esta vazia**. Esse e o pior
          # modo de falha do dominio: sem lista, o servico responde 201 com
          # `correspondencias: []` e aprova todo mundo. Nao parece quebrado â€” parece
          # limpo. Ligar o readiness a ter lista carregada e o que tira o pod do
          # balanceador antes de ele aprovar um sancionado.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # 30s de folga (15 x 2s), contra os 2 minutos do credit-analysis: o boot aqui
          # e ler CSV do proprio filesystem. Dar mais tempo do que o boot precisa atrasa
          # a deteccao de um pod que subiu quebrado.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              # SEM limite de CPU, pela mesma razao dos outros dois: limite provoca
              # throttling do CFS no burst, e o request ja garante a fatia sob
              # contencao. Aqui o burst e a varredura da lista inteira, que e curta mas
              # intensa â€” exatamente o formato que o throttling penaliza pior.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 15
