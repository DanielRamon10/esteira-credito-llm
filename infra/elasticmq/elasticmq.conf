# Filas do ElasticMQ (SQS local).
#
# ## Por que as filas sao declaradas aqui e nao criadas pela aplicacao
#
# Criar fila na subida do servico daria a ele a permissao `sqs:CreateQueue`, e em producao essa
# permissao nao deveria existir: a fila e infraestrutura, provisionada pelo Terraform, e um servico
# que pode criar fila pode criar fila errada. O IAM do modulo concede apenas
# `SendMessage`/`ReceiveMessage`/`DeleteMessage`.
#
# Declarar no arquivo mantem o local igual ao remoto nesse aspecto: a aplicacao encontra a fila
# pronta nos dois.

include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  # O `context-path` vazio faz as URLs saírem como `http://host:9324/000000000000/nome`, no mesmo
  # formato que o SQS — o que permite a aplicacao usar a mesma string de URL nos dois ambientes.
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # `relaxed` aceita nomes de fila que o SQS aceitaria; `strict` recusaria alguns e a diferenca
  # apareceria so ao migrar.
  sqs-limits = strict
}

queues {
  # Fila de extracao. O `deadLettersQueue` e o que reproduz a `RedrivePolicy` do SQS.
  extracao-documentos {
    # 300s, o mesmo valor de `VISIBILIDADE_SEGUNDOS` no adapter.
    #
    # Precisa cobrir o pior caso do OCR (148s medidos neste projeto). Menor que isso, o ElasticMQ
    # reentregaria a mensagem **enquanto o trabalhador ainda processa** — a idempotencia salvaria o
    # resultado, e o custo de OCR seria pago duas vezes.
    defaultVisibilityTimeout = 300 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds

    deadLettersQueue {
      name = "extracao-documentos-dlq"
      # 3 tentativas, e o numero mora **aqui** e nao no codigo.
      #
      # E a diferenca central entre o adapter em memoria e o de SQS: em memoria a contagem e nossa,
      # no SQS ela e da fila. Duas contagens divergiriam, e a da fila sobrevive ao reinicio do
      # trabalhador enquanto a nossa nao.
      maxReceiveCount = 3
    }
  }

  # Fila de descarte. Documento que estourou as tentativas para aqui, e "quais documentos
  # estouraram, e por que?" e a pergunta que se faz durante incidente.
  extracao-documentos-dlq {
    defaultVisibilityTimeout = 300 seconds
  }
}
